<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Kinematics Simulation</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --muted-color: #94a3b8;
      --vel-color: #ef4444;
      --acc-color: #22c55e;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    h2 {
      font-size: 1.25rem;
      color: var(--accent-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-color);
      margin-bottom: 6px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--muted-color);
    }

    .input-group input[type="number"] {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .input-group input[type="number"]:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--border-color);
      color: var(--text-color);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-chip {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .preset-chip:hover {
      border-color: var(--accent-color);
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    canvas {
      flex: 1;
      background-color: var(--bg-color);
      cursor: crosshair;
    }

    .readout-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      gap: 20px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .readout-item span {
      color: var(--muted-color);
      display: block;
      font-size: 0.7rem;
    }

    .legend {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 12px;
      height: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Controls Sidebar -->
  <div class="sidebar">
    <h2>Kinematics Simulator</h2>

    <div>
      <div class="section-title">Presets</div>
      <div class="presets">
        <button class="preset-chip" onclick="applyPreset(0, 0, 20, 35, 0, -9.8)">Standard Launch</button>
        <button class="preset-chip" onclick="applyPreset(0, 40, 25, 0, 0, -9.8)">Horizontal Cliff</button>
        <button class="preset-chip" onclick="applyPreset(0, 0, 15, 30, -3, -9.8)">Headwind Acceleration</button>
        <button class="preset-chip" onclick="applyPreset(0, 0, 10, 10, 2, 0)">Zero Gravity Thrust</button>
      </div>
    </div>

    <div>
      <div class="section-title">Initial Position r₀ (m)</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="x0">x₀</label>
          <input type="number" id="x0" value="0" step="1">
        </div>
        <div class="input-group">
          <label for="y0">y₀</label>
          <input type="number" id="y0" value="0" step="1">
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Initial Velocity v₀ (m/s)</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="v0x">v₀ₓ</label>
          <input type="number" id="v0x" value="20" step="1">
        </div>
        <div class="input-group">
          <label for="v0y">v₀ᵧ</label>
          <input type="number" id="v0y" value="35" step="1">
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Acceleration Vector g (m/s²)</div>
      <div class="input-grid">
        <div class="input-group">
          <label for="gx">gₓ</label>
          <input type="number" id="gx" value="0" step="0.5">
        </div>
        <div class="input-group">
          <label for="gy">gᵧ</label>
          <input type="number" id="gy" value="-9.8" step="0.5">
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Simulation Speed</div>
      <div class="input-group">
        <input type="range" id="timeSpeed" min="0.1" max="2" value="1" step="0.1">
      </div>
    </div>

    <div class="checkbox-group">
      <label class="checkbox-item">
        <input type="checkbox" id="showVel" checked>
        Show Velocity Vector (v)
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="showAcc" checked>
        Show Acceleration Vector (a)
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="stopAtGround" checked>
        Stop when y < 0
      </label>
    </div>

    <div class="btn-group">
      <button id="startBtn" class="btn-primary" onclick="togglePlay()">Start</button>
      <button class="btn-secondary" onclick="resetSim()">Reset</button>
    </div>
  </div>

  <!-- Main Canvas Area -->
  <div class="main-content">
    <canvas id="simCanvas"></canvas>

    <!-- Real-time Readout Overlay -->
    <div class="readout-bar">
      <div class="readout-item">
        <span>TIME (t)</span>
        <div id="readoutT">0.00 s</div>
      </div>
      <div class="readout-item">
        <span>POSITION r(t)</span>
        <div id="readoutR">(0.0, 0.0) m</div>
      </div>
      <div class="readout-item">
        <span>VELOCITY v(t)</span>
        <div id="readoutV">(0.0, 0.0) m/s</div>
      </div>
    </div>

    <!-- Legend Overlay -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--accent-color);"></div>
        Trajectory Line
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--vel-color);"></div>
        Velocity Vector (v)
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--acc-color);"></div>
        Acceleration Vector (a)
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Simulation Parameters
    let params = {
      x0: 0, y0: 0,
      v0x: 20, v0y: 35,
      gx: 0, gy: -9.8,
      timeSpeed: 1,
      stopAtGround: true,
      showVel: true,
      showAcc: true
    };

    let currentTime = 0;
    let isRunning = false;
    let animationFrameId = null;
    let lastTimestamp = null;

    // Viewport Transformation (meters to canvas pixels)
    const originX = 80;
    let originY = 0;
    const scale = 8; // 8 pixels = 1 meter

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      originY = canvas.height - 80;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    function readInputs() {
      params.x0 = parseFloat(document.getElementById('x0').value) || 0;
      params.y0 = parseFloat(document.getElementById('y0').value) || 0;
      params.v0x = parseFloat(document.getElementById('v0x').value) || 0;
      params.v0y = parseFloat(document.getElementById('v0y').value) || 0;
      params.gx = parseFloat(document.getElementById('gx').value) || 0;
      params.gy = parseFloat(document.getElementById('gy').value) || 0;
      params.timeSpeed = parseFloat(document.getElementById('timeSpeed').value) || 1;
      params.stopAtGround = document.getElementById('stopAtGround').checked;
      params.showVel = document.getElementById('showVel').checked;
      params.showAcc = document.getElementById('showAcc').checked;
    }

    function applyPreset(x0, y0, v0x, v0y, gx, gy) {
      document.getElementById('x0').value = x0;
      document.getElementById('y0').value = y0;
      document.getElementById('v0x').value = v0x;
      document.getElementById('v0y').value = v0y;
      document.getElementById('gx').value = gx;
      document.getElementById('gy').value = gy;
      resetSim();
    }

    // Kinematics Formulas
    function getPosition(t) {
      const x = params.x0 + params.v0x * t + 0.5 * params.gx * t * t;
      const y = params.y0 + params.v0y * t + 0.5 * params.gy * t * t;
      return { x, y };
    }

    function getVelocity(t) {
      const vx = params.v0x + params.gx * t;
      const vy = params.v0y + params.gy * t;
      return { vx, vy };
    }

    function toCanvasCoords(x, y) {
      return {
        cx: originX + x * scale,
        cy: originY - y * scale
      };
    }

    // Drawing Functions
    function drawGrid() {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;

      // Vertical grid lines
      for (let x = 0; x < canvas.width; x += scale * 10) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Horizontal grid lines
      for (let y = canvas.height; y > 0; y -= scale * 10) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Axes
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;

      // X Axis (y = 0)
      ctx.beginPath();
      ctx.moveTo(0, originY);
      ctx.lineTo(canvas.width, originY);
      ctx.stroke();

      // Y Axis (x = 0)
      ctx.beginPath();
      ctx.moveTo(originX, 0);
      ctx.lineTo(originX, canvas.height);
      ctx.stroke();

      // Origin Label
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px sans-serif';
      ctx.fillText('(0,0)', originX - 35, originY + 20);
    }

    function drawTrajectory() {
      ctx.beginPath();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);

      let t = 0;
      let maxT = 20; // fallback max duration
      let dt = 0.05;

      const start = toCanvasCoords(params.x0, params.y0);
      ctx.moveTo(start.cx, start.cy);

      while (t <= maxT) {
        t += dt;
        const pos = getPosition(t);
        const coords = toCanvasCoords(pos.x, pos.y);

        ctx.lineTo(coords.cx, coords.cy);

        if (params.stopAtGround && pos.y < 0 && t > 0.1) {
          break;
        }
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawVector(startX, startY, vecX, vecY, color, label) {
      const headLength = 8;
      const angle = Math.atan2(-vecY, vecX);
      const endX = startX + vecX;
      const endY = startY - vecY;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;

      // Arrow line
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // Arrowhead
      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(
        endX - headLength * Math.cos(angle - Math.PI / 6),
        endY + headLength * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        endX - headLength * Math.cos(angle + Math.PI / 6),
        endY + headLength * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();

      // Label
      if (label) {
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(label, endX + 8, endY - 8);
      }
    }

    function drawParticle() {
      const pos = getPosition(currentTime);
      const vel = getVelocity(currentTime);
      const coords = toCanvasCoords(pos.x, pos.y);

      // Particle Body
      ctx.beginPath();
      ctx.arc(coords.cx, coords.cy, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Velocity Vector
      if (params.showVel) {
        drawVector(coords.cx, coords.cy, vel.vx * 1.5, vel.vy * 1.5, '#ef4444', 'v');
      }

      // Acceleration Vector
      if (params.showAcc && (params.gx !== 0 || params.gy !== 0)) {
        drawVector(coords.cx, coords.cy, params.gx * 4, params.gy * 4, '#22c55e', 'a');
      }

      // Update UI Readouts
      document.getElementById('readoutT').textContent = `${currentTime.toFixed(2)} s`;
      document.getElementById('readoutR').textContent = `(${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}) m`;
      document.getElementById('readoutV').textContent = `(${vel.vx.toFixed(1)}, ${vel.vy.toFixed(1)}) m/s`;
    }

    function draw() {
      readInputs();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawTrajectory();
      drawParticle();
    }

    function update(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isRunning) {
        currentTime += deltaTime * params.timeSpeed;

        const currentPos = getPosition(currentTime);
        if (params.stopAtGround && currentPos.y < 0 && currentTime > 0.05) {
          isRunning = false;
          document.getElementById('startBtn').textContent = 'Start';
          document.getElementById('startBtn').className = 'btn-primary';
        }
      }

      draw();

      if (isRunning) {
        animationFrameId = requestAnimationFrame(update);
      }
    }

    function togglePlay() {
      isRunning = !isRunning;
      const btn = document.getElementById('startBtn');

      if (isRunning) {
        btn.textContent = 'Pause';
        btn.className = 'btn-secondary';
        lastTimestamp = performance.now();
        animationFrameId = requestAnimationFrame(update);
      } else {
        btn.textContent = 'Resume';
        btn.className = 'btn-primary';
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      }
    }

    function resetSim() {
      isRunning = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      currentTime = 0;
      lastTimestamp = null;

      const btn = document.getElementById('startBtn');
      btn.textContent = 'Start';
      btn.className = 'btn-primary';

      draw();
    }

    // Input listeners for real-time preview updates
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => {
        if (!isRunning) draw();
      });
    });

    // Initialize
    resizeCanvas();
  </script>
</body>
</html>
